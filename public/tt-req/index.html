<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e0c"><title>TT-REQ // HTTP WORKBENCH</title><link rel="stylesheet" href="/tt-req/style.css"></head>
<body><main class="shell"><header><a href="/" class="back">← PORTAL</a><div><small>NHKHUY / PRIVATE TOOL</small><h1>HTTP<span>_</span>WORKBENCH</h1></div><span class="owner">OWNER SESSION <i></i></span></header>
<nav><button class="tab active" data-tab="monitor">MONITOR</button><button class="tab" data-tab="send">SEND REQUEST</button><button class="tab" data-tab="jobs">SCHEDULED JOBS</button></nav>
<section id="monitor" class="page active"><div class="heading"><div><small>01 //</small><h2>OVERVIEW</h2></div><button id="refresh" class="secondary">REFRESH</button></div><div class="metrics"><article><small>JOBS</small><strong id="metric-jobs">—</strong></article><article><small>ENABLED</small><strong id="metric-enabled">—</strong></article><article><small>RECENT SUCCESS</small><strong id="metric-rate">—</strong></article></div><div id="monitor-list" class="job-list"></div></section>
<section id="send" class="page"><div class="heading"><div><small>02 //</small><h2>ONE-OFF REQUEST</h2></div><button id="parse-curl" class="secondary">IMPORT cURL</button></div><label>METHOD / URL</label><div class="request-line"><select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select><input id="url" placeholder="https://api.example.com/resource"></div><label>HEADERS · JSON OBJECT</label><textarea id="headers" rows="4">{}</textarea><label>BODY</label><textarea id="body" rows="7" placeholder='{"hello":"world"}'></textarea><button id="send" class="primary">▶ SEND REQUEST</button><div id="response" class="response hidden"></div></section>
<section id="jobs" class="page"><div class="heading"><div><small>03 //</small><h2>JOB SCHEDULER</h2></div></div><div class="form-grid"><div><label>JOB NAME</label><input id="job-name" placeholder="My API monitor"></div><div><label>INTERVAL · SECONDS (0 = MANUAL ONLY)</label><input id="job-interval" type="number" min="0" step="60" value="0"></div></div><label>STEPS · JSON ARRAY (1–12)</label><textarea id="job-steps" rows="10">[
  {
    "name": "Request",
    "method": "GET",
    "url": "https://example.com",
    "headers": {},
    "body": "",
    "asserts": []
  }
]</textarea><label>VARIABLES · JSON OBJECT</label><textarea id="job-vars" rows="3">{}</textarea><label class="check"><input id="job-enabled" type="checkbox"> Enable schedule after saving</label><button id="save-job" class="primary">＋ SAVE JOB</button><div id="jobs-list" class="job-list"></div></section>
<footer>PRIVATE WORKSPACE · SERVER-SIDE DATA · HTTP(S) PUBLIC DESTINATIONS ONLY</footer></main><script src="/tt-req/app.js"></script></body></html>
