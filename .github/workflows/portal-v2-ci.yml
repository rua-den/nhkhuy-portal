name: Portal v2 CI

on:
  push:
    branches:
      - feature/portal-v2-dotnet-angular
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/portal-v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-v2-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Build .NET 10 API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build v2/backend/Nhkhuy.Portal.Api/Nhkhuy.Portal.Api.csproj --configuration Release

  frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: v2/frontend
        run: npm install
      - name: Build
        working-directory: v2/frontend
        run: npm run build
