name: Deploy Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Deployment preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Syntax and HTTP smoke tests
        run: |
          set -euo pipefail
          npm run check
          npm test
          HOST=127.0.0.1 PORT=4189 PORTAL_DATA_DIR="$RUNNER_TEMP/portal-data" PORTAL_COOKIE_SECURE=false node src/server.js > "$RUNNER_TEMP/portal.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4189/api/health > "$RUNNER_TEMP/health.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$RUNNER_TEMP/portal.log"; exit 1; fi
            sleep 1
          done
          test "$ready" -eq 1 || { cat "$RUNNER_TEMP/portal.log"; exit 1; }
          node -e 'const h=require(process.argv[1]); if(h.status!=="ok" || h.service!=="nhkhuy-portal") process.exit(1)' "$RUNNER_TEMP/health.json"
          services_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4189/api/services)"
          test "$services_status" = "401"
          root_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4189/)"
          test "$root_status" = "302"
          curl --fail --silent --show-error http://127.0.0.1:4189/login.html > "$RUNNER_TEMP/login.html"
          grep -q "OWNER_LOGIN" "$RUNNER_TEMP/login.html"

  deploy:
    name: Deploy to production VPS
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.CD_ENABLED == 'true' && vars.PROD_CUTOVER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "::error::Missing prod secret VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::Missing prod secret VPS_USER"; exit 1; }
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "::error::Missing prod secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "::error::Missing prod secret VPS_KNOWN_HOSTS"; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Package release
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/portal-release.tar.gz" src public config package.json

      - name: Upload and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          SSH_DIR="$(mktemp -d)"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$SSH_DIR/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/id_ed25519" "$SSH_DIR/known_hosts"
          SSH_OPTS="-i $SSH_DIR/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/nhkhuy-portal-artifacts" && chmod 750 "$HOME/nhkhuy-portal-artifacts"'
          scp $SSH_OPTS "$RUNNER_TEMP/portal-release.tar.gz" "$VPS_USER@$VPS_HOST:nhkhuy-portal-artifacts/$GITHUB_SHA.tar.gz"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/deploy-nhkhuy-portal $GITHUB_SHA"
